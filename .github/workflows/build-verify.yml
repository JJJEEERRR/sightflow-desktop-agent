name: Build Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-script: 'build:win'
          - os: macos-latest
            build-script: 'build:mac'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # node-gyp@9 (bundled with Node 22) imports `distutils`, removed from
      # Python 3.12. Pin 3.11 for native-module compilation. See ADR-0003.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build (no installer)
        # We invoke electron-builder via electron-vite without distributable target
        # to verify the codebase compiles. We do NOT publish artifacts.
        run: npm run build:unpack

      - name: List dist artifacts
        if: always()
        shell: bash
        run: |
          ls -la dist/ || echo "no dist directory"
